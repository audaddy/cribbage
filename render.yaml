# Render blueprint: a web service plus a managed Postgres instance.
# Deploy with:  render blueprint launch   (or connect the repo in the dashboard)
#
# Before deploying, switch the datasource provider in prisma/schema.prisma to
# "postgresql" — `node scripts/use-database.mjs postgresql` does it for you.

services:
  - type: web
    name: cribbage
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: cribbage-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: MAGIC_LINK_TTL_MINUTES
        value: "15"
      - key: SESSION_TTL_DAYS
        value: "30"
      # Optional integrations — set these in the dashboard when you want them.
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: EMAIL_WEBHOOK_TOKEN
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: NOTIFY_WEBHOOK_URL
        sync: false

databases:
  - name: cribbage-db
    plan: free
    databaseName: cribbage
    user: cribbage
